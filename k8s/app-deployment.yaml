apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: springboot

  template:
    metadata:
      labels:
        app: springboot

    spec:
      containers:
      - name: springboot-container

        image: saikumar004/snapchat-sak-cicd-docker:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8080

        
        env:
      - name: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-service:3306/snapchatdb?createDatabaseIfNotExist=true

      - name: SPRING_DATASOURCE_USERNAME
        value: springuser

      - name: SPRING_DATASOURCE_PASSWORD
        value: spring123

      - name: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

      - name: SPRING_JPA_SHOW_SQL
        value: "true"