<section class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Instrument List</h2>

        <a th:href="@{/admin/add_product}" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Add Instrument
        </a>
    </div>

    <div class="row">

        <div class="col-lg-4 col-md-6 mb-4"
             th:each="product : ${products}">

            <div class="card shadow h-100">

                <img th:if="${product.base64Image}"
                     th:src="'data:image/jpeg;base64,' + ${product.base64Image}"
                     class="card-img-top"
                     style="height:250px;object-fit:cover;">

                <img th:unless="${product.base64Image}"
                     src="https://images.unsplash.com/photo-1511379938547-c1f69419868d"
                     class="card-img-top"
                     style="height:250px;object-fit:cover;">

                <div class="card-body">

                    <h4 class="fw-bold"
                        th:text="${product.productName}">
                    </h4>

                    <p class="text-muted"
                       th:text="${product.productDescription}">
                    </p>

                    <hr>

                    <p>
                        <strong>Instrument ID :</strong>
                        <span th:text="${product.productId}"></span>
                    </p>

                    <p>
                        <strong>Price :</strong>
                        ₹ <span th:text="${product.price}"></span>
                    </p>

                    <p>
                        <strong>Available Stock :</strong>
                        <span th:text="${product.quantity}"></span>
                    </p>

                </div>

                <div class="card-footer bg-white">

                    <form th:action="@{/admin/delete_product/{id}(id=${product.productId})}"
                          method="post">

                        <button class="btn btn-danger w-100">
                            <i class="fa-solid fa-trash"></i>
                            Delete
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <div class="text-center mt-4">

        <a th:href="@{/admin/admin_dash}" class="btn btn-secondary">
            Back to Dashboard
        </a>

    </div>

</section>
