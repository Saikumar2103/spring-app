<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <title>Watch Inventory Catalog</title>
</head>
<body>
<section class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold brand-font mb-1">Timepiece Inventory</h2>
            <p class="text-muted small mb-0">Manage current luxury watch stock and listings</p>
        </div>

        <a th:href="@{/admin/add_product}" class="btn btn-gold">
            <i class="fa-solid fa-plus me-1"></i> Add New Watch
        </a>
    </div>

    <div class="row">
        <div class="col-lg-4 col-md-6 mb-4" th:each="product : ${products}">
            <div class="card shadow-sm h-100 border-0 rounded-3 overflow-hidden">
                <img th:if="${product.base64Image}"
                     th:src="'data:image/jpeg;base64,' + ${product.base64Image}"
                     class="card-img-top"
                     style="height:260px; object-fit:cover;">

                <img th:unless="${product.base64Image}"
                     src="https://images.unsplash.com/photo-1524805444758-089113d48a6d?q=80&w=600"
                     class="card-img-top"
                     style="height:260px; object-fit:cover;">

                <div class="card-body">
                    <h4 class="fw-bold brand-font mb-2" th:text="${product.productName}">
                        Rolex Submariner
                    </h4>

                    <p class="text-muted small" th:text="${product.productDescription}">
                        Diver's watch with ceramic bezel and oyster bracelet.
                    </p>

                    <hr class="my-3">

                    <p class="mb-1">
                        <strong>Timepiece ID:</strong>
                        <span class="text-secondary" th:text="${product.productId}"></span>
                    </p>

                    <p class="mb-1">
                        <strong>Price:</strong>
                        <span class="text-success fw-bold">₹ <span th:text="${product.price}"></span></span>
                    </p>

                    <p class="mb-0">
                        <strong>In Stock:</strong>
                        <span class="badge bg-dark" th:text="${product.quantity}"></span> units
                    </p>
                </div>

                <div class="card-footer bg-light border-0 p-3">
                    <form th:action="@{/admin/delete_product/{id}(id=${product.productId})}" method="post">
                        <button class="btn btn-outline-danger btn-sm w-100 fw-bold">
                            <i class="fa-solid fa-trash-can me-1"></i> Remove Model
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/admin/admin_dash}" class="btn btn-secondary px-4">
            Back to Dashboard
        </a>
    </div>

</section>
</body>
</html>
