<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Timekeepers | Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    margin:0; padding:0; box-sizing:border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0d0e12, #1a1e29);
    font-family: 'Plus Jakarta Sans', sans-serif;
}

.container-box { width: 390px; }

.heading {
    color: #c5a059;
    font-family: 'Cinzel', serif;
    text-align: center;
    letter-spacing: 4px;
    margin-bottom: 25px;
    font-size: 28px;
}

.login-box {
    background: #12151c;
    padding: 35px;
    border-radius: 12px;
    border: 1px solid rgba(197, 160, 89, 0.2);
    box-shadow: 0 15px 30px rgba(0,0,0,.6);
}

.input-group {
    display: flex;
    margin-bottom: 20px;
}

.icon {
    width: 50px;
    background: #1c202b;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #c5a059;
    font-size: 16px;
    border-radius: 6px 0 0 6px;
}

.input-group input {
    flex: 1;
    height: 50px;
    border: none;
    outline: none;
    padding-left: 15px;
    font-size: 15px;
    background: #242936;
    color: white;
    border-radius: 0 6px 6px 0;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #94a3b8;
    font-size: 13px;
    margin: 20px 0;
}

.options a {
    color: #c5a059;
    text-decoration: none;
}

.login-btn {
    width: 100%;
    border: none;
    background: #c5a059;
    color: #0d0e12;
    height: 48px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    border-radius: 6px;
    transition: .3s;
}

.login-btn:hover { background: #b08c46; }

.register-btn {
    display: block;
    width: 100%;
    margin-top: 15px;
    text-align: center;
    background: transparent;
    border: 1px solid #c5a059;
    color: #c5a059;
    text-decoration: none;
    padding: 12px;
    font-size: 14px;
    letter-spacing: 2px;
    font-weight: bold;
    border-radius: 6px;
    transition: .3s;
}

.register-btn:hover { background: #c5a059; color: #0d0e12; }
</style>
</head>

<body>
<div class="container-box">
    <h2 class="heading"><i class="fa-solid fa-clock me-2"></i>Login</h2>

    <div class="login-box">
        <form th:action="@{/login}" method="post">
            <div class="input-group">
                <div class="icon"><i class="fa-solid fa-user"></i></div>
                <input type="text" id="userName" name="userName" placeholder="Username" required autocomplete="off">
            </div>

            <div class="input-group">
                <div class="icon"><i class="fa-solid fa-lock"></i></div>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">LOGIN</button>
        </form>
    </div>

    <a th:href="@{/signup}" class="register-btn">REGISTER ACCOUNT</a>
</div>
</body>
</html>
