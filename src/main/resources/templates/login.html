<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(rgba(20, 10, 35, 0.4), rgba(20, 10, 35, 0.6)), 
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1920');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            color: #ffffff;
        }

        .card-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
        }

        /* Minimal Underline Inputs */
        .form-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            display: block;
        }

        .glass-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.7);
            color: #ffffff;
            padding: 0.5rem 0;
            outline: none;
            font-size: 1rem;
        }

        .glass-input:focus {
            border-bottom-color: #ffffff;
        }

        /* Checkbox & Options */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .options-row a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }

        /* Rounded Pill Button */
        .btn-submit {
            width: 100%;
            background-color: #ffffff;
            color: #1e1b4b;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 30px;
            border: none;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #f1f5f9;
            transform: translateY(-2px);
        }

        .footer-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .footer-text a {
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h2 class="card-title">Login</h2>
        
        <form th:action="@{/login}" method="post">

    <div class="form-group">
        <label for="userName">Username</label>
        <input type="text"
               id="userName"
               name="userName"
               class="glass-input"
               placeholder="Enter your username"
               required
               autocomplete="off">
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password"
               id="password"
               name="password"
               class="glass-input"
               placeholder="Enter your password"
               required>
    </div>

    <div class="options-row">
        <label class="d-flex align-items-center gap-2">
            <input type="checkbox" name="remember">
            Remember Me
        </label>

        <a href="#">Forgot Password?</a>
    </div>

    <button type="submit" class="btn-submit">
        Login
    </button>

</form>

        <div class="footer-text">
            Don't have an account? <a th:href="@{/signup}">Register</a>
        </div>
    </div>

</body>
</html>
