<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#1f5560,#4b8b97);

}

.container-box{

    width:380px;

}

.heading{

    color:white;

    text-align:center;

    letter-spacing:5px;

    margin-bottom:30px;

    font-size:34px;

    font-weight:300;

}

.login-box{

    background:#10252d;

    padding:30px;

    box-shadow:0 10px 25px rgba(0,0,0,.4);

}

.input-group{

    display:flex;

    margin-bottom:18px;

}

.icon{

    width:55px;

    background:#e8e8e8;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#555;

    font-size:18px;

}

.input-group input{

    flex:1;

    height:52px;

    border:none;

    outline:none;

    padding-left:15px;

    font-size:16px;

    background:#f2f2f2;

}

.options{

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:white;

    font-size:14px;

    margin:25px 0;

}

.options a{

    color:white;

    text-decoration:none;

    font-style:italic;

}

.login-btn{

    width:100%;

    border:none;

    background:#5c8f9a;

    color:white;

    height:50px;

    font-size:18px;

    font-weight:bold;

    letter-spacing:2px;

    transition:.3s;

}

.login-btn:hover{

    background:#4b7b86;

}

.register-btn{

    display:block;

    width:100%;

    margin-top:20px;

    text-align:center;

    background:#10252d;

    color:white;

    text-decoration:none;

    padding:18px;

    font-size:18px;

    letter-spacing:2px;

    font-weight:bold;

    transition:.3s;

}

.register-btn:hover{

    background:#17343e;

    color:white;

}

</style>

</head>

<body>

<div class="container-box">

    <h2 class="heading">USER LOGIN</h2>

    <div class="login-box">

        <form th:action="@{/login}" method="post">

            <div class="input-group">

                <div class="icon">
                    <i class="fa-solid fa-user"></i>
                </div>

                <input
                type="text"
                id="userName"
                name="userName"
                placeholder="Username"
                required
                autocomplete="off">

            </div>

            <div class="input-group">

                <div class="icon">
                    <i class="fa-solid fa-lock"></i>
                </div>

                <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required>

            </div>

            <div class="options">

                <label>
                    <input type="checkbox" name="remember">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit" class="login-btn">
                LOGIN
            </button>

        </form>

    </div>

    <a th:href="@{/signup}" class="register-btn">
        REGISTER
    </a>

</div>

</body>
</html>
