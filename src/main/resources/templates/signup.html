<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Aura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #120c24 0%, #1e133a 50%, #0d0818 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Central Floating Card */
        .signup-card {
            background-color: #272147;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
        }

        .card-body-custom {
            padding: 3rem 2.5rem;
        }

        .signup-title {
            color: #ffffff;
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2.5rem;
        }

        /* Rectangular Soft Input Fields */
        .custom-input {
            width: 100%;
            background-color: #e2e8f0;
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
            color: #1e293b;
            outline: none;
        }

        .custom-input::placeholder {
            color: #64748b;
        }

        /* Purple Button */
        .btn-purple {
            width: 100%;
            background-color: #5b469b;
            color: #ffffff;
            font-weight: 700;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .btn-purple:hover {
            background-color: #4c3a82;
        }
    </style>
</head>
<body>

    <div class="signup-card">
        <div class="card-body-custom">
            <h2 class="signup-title">Sign up</h2>

            <form th:action="@{/signup}" method="post" th:object="${user}">
                <input type="text" class="custom-input" placeholder="User name" th:field="*{userName}" required>
                <input type="email" class="custom-input" placeholder="Email" th:field="*{emailId}" required>
                <input type="password" class="custom-input" placeholder="Password" th:field="*{password}" required>

                <button type="submit" class="btn-purple">Sign up</button>
            </form>
        </div>
    </div>

</body>
</html>
