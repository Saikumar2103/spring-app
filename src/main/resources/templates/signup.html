<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Aura</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            min-height:100vh;
            background:linear-gradient(135deg,#120c24 0%,#1e133a 50%,#0d0818 100%);
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial,Helvetica,sans-serif;
        }

        .signup-card{
            background:#272147;
            width:100%;
            max-width:420px;
            border-radius:18px;
            box-shadow:0 20px 40px rgba(0,0,0,.5);
        }

        .card-body-custom{
            padding:40px;
        }

        .signup-title{
            color:white;
            text-align:center;
            font-weight:bold;
            margin-bottom:30px;
        }

        .custom-input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
            background:#e2e8f0;
            outline:none;
            font-size:15px;
        }

        .custom-select{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
            background:#e2e8f0;
            outline:none;
            font-size:15px;
        }

        .btn-purple{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#5b469b;
            color:white;
            font-weight:bold;
            font-size:16px;
        }

        .btn-purple:hover{
            background:#48357e;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
            color:white;
        }

        .login-link a{
            color:#8ec5ff;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="signup-card">

    <div class="card-body-custom">

        <h2 class="signup-title">Sign Up</h2>

        <form th:action="@{/signup}" method="post" th:object="${user}">

            <!-- Username -->
            <input
                type="text"
                class="custom-input"
                placeholder="Username"
                th:field="*{userName}"
                required>

            <!-- Email -->
            <input
                type="email"
                class="custom-input"
                placeholder="Email"
                th:field="*{emailId}"
                required>

            <!-- Gender -->
            <select
                class="custom-select"
                th:field="*{gender}"
                required>

                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>

            </select>

            <!-- Phone Number -->
            <input
                type="tel"
                class="custom-input"
                placeholder="Phone Number"
                th:field="*{phoneNumber}"
                required>

            <!-- Password -->
            <input
                type="password"
                class="custom-input"
                placeholder="Password"
                th:field="*{password}"
                required>

            <button type="submit" class="btn-purple">
                Sign Up
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a th:href="@{/login}">Login</a>
        </div>

    </div>

</div>

</body>
</html>
