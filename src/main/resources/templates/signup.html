<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Timekeepers | Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0e12 0%, #1a1e29 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .signup-card {
            background: #12151c;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            border: 1px solid rgba(197, 160, 89, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,.6);
        }

        .card-body-custom { padding: 40px; }

        .signup-title {
            color: #c5a059;
            font-family: 'Cinzel', serif;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .custom-input, .custom-select {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
            background: #242936;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .custom-input::placeholder { color: #8892b0; }

        .btn-gold {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #c5a059;
            color: #0d0e12;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .btn-gold:hover { background: #b08c46; }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 14px;
        }

        .login-link a {
            color: #c5a059;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="signup-card">
    <div class="card-body-custom">
        <h2 class="signup-title">JOIN AURA CLUB</h2>

        <form th:action="@{/signup}" method="post" th:object="${user}">
            <input type="text" class="custom-input" placeholder="Username" th:field="*{userName}" required>
            <input type="email" class="custom-input" placeholder="Email Address" th:field="*{emailId}" required>

            <select class="custom-select" th:field="*{gender}" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <input type="tel" class="custom-input" placeholder="Phone Number" th:field="*{phoneNumber}" required>
            <input type="password" class="custom-input" placeholder="Password" th:field="*{password}" required>

            <button type="submit" class="btn-gold">CREATE ACCOUNT</button>
        </form>

        <div class="login-link">
            Already registered?
            <a th:href="@{/login}">Login Here</a>
        </div>
    </div>
</div>

</body>
</html>
