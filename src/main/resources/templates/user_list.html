<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">
<head>
    <title>User List</title>
</head>
<body>
    <section class="container-fluid py-5 directory-wrapper">
        
        <style>
            /* Dynamic Blue-to-Teal Canvas Background */
            .directory-wrapper {
                min-height: 85vh;
                background: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Floating White Card Container */
            .directory-card {
                background: #ffffff;
                border-radius: 16px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
                border: none;
                width: 100%;
                max-width: 1000px;
                padding: 2.5rem;
            }

            /* Gradient Title Header */
            .directory-title {
                color: #0082c8;
                font-size: 1.8rem;
                letter-spacing: -0.5px;
                position: relative;
            }

            .directory-title::after {
                content: '';
                display: block;
                width: 60px;
                height: 3px;
                background: linear-gradient(90deg, #0082c8, #00ecbc);
                margin: 8px auto 0 auto;
                border-radius: 2px;
            }

            /* Modern Teal Minimalist Table */
            .table-modern {
                border-collapse: separate;
                border-spacing: 0;
            }

            .table-modern thead th {
                background-color: transparent;
                color: #0082c8;
                font-weight: 700;
                font-size: 0.85rem;
                text-transform: uppercase;
                letter-spacing: 1px;
                border-bottom: 2px solid #e2e8f0;
                padding-bottom: 12px;
            }

            .table-modern tbody tr {
                transition: all 0.2s ease;
            }

            .table-modern tbody tr:hover {
                background-color: #f8fafc;
            }

            .table-modern td {
                padding: 1rem 0.75rem;
                color: #334155;
                border-bottom: 1px solid #f1f5f9;
                font-size: 0.92rem;
            }

            /* Teal Accent Action Button */
            .btn-delete-teal {
                background: transparent;
                border: 1px solid #00ecbc;
                color: #00a884;
                font-weight: 600;
                font-size: 0.8rem;
                padding: 0.4rem 1rem;
                border-radius: 20px;
                transition: all 0.25s ease;
            }

            .btn-delete-teal:hover {
                background: linear-gradient(90deg, #0082c8, #00ecbc);
                color: #ffffff;
                border-color: transparent;
                box-shadow: 0 4px 12px rgba(0, 236, 188, 0.4);
            }

            /* Back Button Link */
            .btn-back-link {
                color: #0082c8;
                font-weight: 600;
                font-size: 0.9rem;
                text-decoration: none;
                transition: color 0.2s ease;
            }

            .btn-back-link:hover {
                color: #00ecbc;
            }
        </style>

        <div class="directory-card">
            
            <!-- Header Title -->
            <div class="text-center mb-4">
                <h2 class="fw-bold directory-title mb-1">• Registered Accounts •</h2>
                <p class="text-muted small mt-2">Manage all signed-up user profiles and system permissions.</p>
            </div>

            <!-- Table Container -->
            <div class="table-responsive">
                <table class="table table-modern align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-3">ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Gender</th>
                            <th class="text-end pe-3">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Fallback message when no users exist -->
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center text-muted py-4">No registered users found.</td>
                        </tr>

                        <!-- Loop through user records -->
                        <tr th:each="user : ${users}">
                            <td class="ps-3 fw-bold text-primary" th:text="${user.userId}">1</td>
                            <td class="fw-semibold" th:text="${user.userName}">john_doe</td>
                            <td th:text="${user.emailId}">john@example.com</td>
                            <td th:text="${user.phoneNumber != null} ? ${user.phoneNumber} : 'N/A'">1234567890</td>
                            <td class="text-capitalize" th:text="${user.gender}">Male</td>
                            <td class="text-end pe-3">
                                <form th:action="@{/admin/delete_user/{id}(id=${user.userId})}" 
                                      method="post" 
                                      onsubmit="return confirm('Are you sure you want to delete this user?');" 
                                      style="display:inline;">
                                    
                                    <!-- Automatic CSRF field (required if Spring Security CSRF is active) -->
                                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                    <button type="submit" class="btn btn-delete-teal">
                                        <i class="fa-solid fa-user-minus me-1"></i>Delete
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Card Footer Link -->
            <div class="text-center mt-4 pt-3 border-top border-light">
                <a th:href="@{/admin/admin_dash}" class="btn-back-link">
                    ← Back to Admin Dashboard
                </a>
            </div>

        </div>

    </section>
</body>
</html>
